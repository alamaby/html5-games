<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Stack Rush — HTML5 Portfolio Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b1020; }
  body { font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#fff;
         touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; display:block; }
  .hud { position:fixed; left:0; right:0; top:max(10px, env(safe-area-inset-top)); text-align:center;
         pointer-events:none; z-index:5; }
  #score { font-size:64px; font-weight:800; letter-spacing:2px; text-shadow:0 4px 24px rgba(0,0,0,.45); }
  #best  { font-size:14px; opacity:.65; margin-top:2px; letter-spacing:3px; }
  #combo { font-size:18px; font-weight:700; margin-top:6px; letter-spacing:2px; color:#ffe08a;
           text-shadow:0 2px 12px rgba(0,0,0,.5); opacity:0; transition:opacity .2s; }
  #soundBtn { position:fixed; top:max(12px, env(safe-area-inset-top)); right:14px; z-index:20;
              background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
              font-size:12px; font-weight:700; letter-spacing:1px; padding:8px 12px; border-radius:20px;
              cursor:pointer; backdrop-filter:blur(6px); }
  #soundBtn:active { transform:scale(.94); }
  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
             align-items:center; justify-content:center; text-align:center; padding:24px;
             background:rgba(5,8,18,.55); backdrop-filter:blur(4px); }
  .overlay.hidden { display:none; }
  .overlay h1 { font-size:44px; font-weight:800; letter-spacing:4px; margin-bottom:10px;
                text-shadow:0 6px 30px rgba(0,0,0,.6); }
  .overlay p  { font-size:16px; line-height:1.6; opacity:.85; max-width:320px; }
  .tap-hint { margin-top:26px; font-size:15px; font-weight:700; letter-spacing:3px;
              animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.45; transform:scale(1);} 50% { opacity:1; transform:scale(1.06);} }
  #finalScore { font-size:72px; font-weight:800; margin:8px 0 2px; }
  #finalBest  { font-size:15px; opacity:.7; letter-spacing:2px; margin-bottom:18px; }
  #newBest { color:#ffe08a; font-weight:800; letter-spacing:3px; font-size:16px;
             margin-bottom:10px; display:none; animation:pulse 1s ease-in-out infinite; }
  .foot { position:fixed; left:0; right:0; bottom:max(10px, env(safe-area-inset-bottom));
          text-align:center; font-size:11px; letter-spacing:2px; opacity:.4; z-index:5; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div id="score">0</div>
  <div id="best">BEST 0</div>
  <div id="combo"></div>
</div>
<button id="soundBtn">SOUND ON</button>

<div class="overlay" id="menuOverlay">
  <h1>STACK<br>RUSH</h1>
  <p>Tap untuk menaruh balok.<br>Potongan yang menggantung akan terpotong.<br>Perfect drop = balok tidak menyusut.</p>
  <div class="tap-hint">TAP TO START</div>
</div>

<div class="overlay hidden" id="overOverlay">
  <div id="newBest">★ NEW BEST ★</div>
  <div id="finalScore">0</div>
  <div id="finalBest">BEST 0</div>
  <p>Baloknya meleset!</p>
  <div class="tap-hint">TAP TO RETRY</div>
</div>

<div class="foot">STACK RUSH · HTML5 PORTFOLIO DEMO</div>

<script>
"use strict";
/* ============================================================
   STACK RUSH — hypercasual stacking game, single-file HTML5.
   Canvas 2D · portrait mobile-first · WebAudio synth SFX.
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elBest  = document.getElementById('best');
const elCombo = document.getElementById('combo');
const menuOverlay = document.getElementById('menuOverlay');
const overOverlay = document.getElementById('overOverlay');
const finalScore  = document.getElementById('finalScore');
const finalBest   = document.getElementById('finalBest');
const newBestEl   = document.getElementById('newBest');
const soundBtn    = document.getElementById('soundBtn');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

/* ---------------- audio (tiny synth, no assets) ---------------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, delay, slideTo) {
  if (muted) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function sfxPlace()  { tone(170, 0.10, 'triangle', 0.28, 0, 90); }
function sfxPerfect(combo) {
  const base = 520 * Math.pow(2, Math.min(combo, 16) / 14);
  tone(base, 0.12, 'sine', 0.22); tone(base * 1.5, 0.16, 'sine', 0.18, 0.05);
}
function sfxOver() { tone(240, 0.5, 'sawtooth', 0.16, 0, 70); }
soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  soundBtn.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
});

/* ---------------- game state ---------------- */
const BASE = 3;          // base block size (world units)
const RANGE = 5.2;       // travel range of moving block
const TOL = 0.22;        // perfect-drop tolerance (world units)
const GRAV = 22;

let mode = 'menu';       // menu | playing | over
let layers = [];         // settled: {x,z,w,d}
let cur = null;          // moving: {axis:'x'|'z', pos, dir, w, d, x, z, speed}
let falling = [];        // cut pieces: {x,z,w,d,h, vx, vy, alpha}
let parts = [];          // particles: {x,y,vx,vy,life,maxLife,color,size}
let rings = [];          // shockwave rings on placement
let popups = [];         // floating score text
let score = 0, combo = 0, best = 0;
let camY = 0;            // camera height (layers), lerps to follow tower
let shake = 0, flash = 0;
let hue = 212;           // background hue, drifts as you climb
let overTimer = 0, overAt = 0;
let tapCount = 0;

try { best = parseInt(localStorage.getItem('stackrush_best') || '0', 10) || 0; } catch (e) {}
elBest.textContent = 'BEST ' + best;

function speedFor(n) { return Math.min(2.4 + n * 0.09, 6.4); }

function newGame() {
  layers = [{ x: 0, z: 0, w: BASE, d: BASE }];
  falling = []; parts = []; rings = []; popups = [];
  score = 0; combo = 0; camY = 0; shake = 0; flash = 0; hue = 212;
  tapCount = 0;
  elScore.textContent = '0'; elCombo.style.opacity = 0;
  spawnBlock();
  mode = 'playing';
  menuOverlay.classList.add('hidden');
  overOverlay.classList.add('hidden');
}

function spawnBlock() {
  const prev = layers[layers.length - 1];
  const axis = (layers.length % 2 === 1) ? 'x' : 'z'; // layer 1 moves on x, 2 on z, ...
  cur = { axis, pos: -RANGE, dir: 1, w: prev.w, d: prev.d,
          x: prev.x, z: prev.z, speed: speedFor(layers.length) };
  syncCur();
}
function syncCur() {
  const prev = layers[layers.length - 1];
  if (cur.axis === 'x') { cur.x = cur.pos; cur.z = prev.z; }
  else                  { cur.z = cur.pos; cur.x = prev.x; }
}

function place() {
  if (mode !== 'playing' || !cur) return;
  tapCount++;
  const prev = layers[layers.length - 1];
  const ax = cur.axis;
  const prevC = ax === 'x' ? prev.x : prev.z;
  const curC  = ax === 'x' ? cur.x  : cur.z;
  const size  = ax === 'x' ? cur.w  : cur.d;
  const delta = curC - prevC, ad = Math.abs(delta);

  if (ad >= size) { // total miss -> game over
    const h = layers.length;
    falling.push({ x: cur.x, z: cur.z, w: cur.w, d: cur.d, h, vx: cur.dir * 2.2, vy: -3, alpha: 1, axis: cur.axis });
    cur = null; mode = 'over'; overAt = performance.now();
    sfxOver(); shake = 14;
    return;
  }

  const h = layers.length;
  if (ad <= TOL) { // ---- PERFECT ----
    combo++;
    const nl = { x: prev.x, z: prev.z, w: prev.w, d: prev.d };
    layers.push(nl);
    const gained = 1 + Math.floor(combo / 4);
    score += gained;
    burst(nl.x, nl.z, h, '#ffe08a', 26);
    rings.push({ x: nl.x, z: nl.z, h, r: 0.4, alpha: 0.9 });
    flash = 0.35; shake = 3;
    popups.push({ x: nl.x, z: nl.z, h, text: combo > 1 ? 'PERFECT x' + combo : 'PERFECT',
                  life: 1, color: '#ffe08a' });
    if (gained > 1) popups.push({ x: nl.x + 1.2, z: nl.z, h, text: '+' + gained, life: 1, color: '#fff' });
    sfxPerfect(combo);
  } else { // ---- CUT ----
    combo = 0;
    const sign = delta > 0 ? 1 : -1;
    const newSize = size - ad;
    // kept segment = overlap of [prevC-size/2, prevC+size/2] and [curC-size/2, curC+size/2]
    const lo = Math.max(prevC - size / 2, curC - size / 2);
    const hi = Math.min(prevC + size / 2, curC + size / 2);
    const keptC = (lo + hi) / 2;
    // cut segment
    const cutLo = prevC + sign * (size / 2), cutHi = curC + sign * (size / 2);
    const cutC = (cutLo + cutHi) / 2;
    const nl = { x: prev.x, z: prev.z, w: prev.w, d: prev.d };
    if (ax === 'x') { nl.x = keptC; nl.w = newSize; } else { nl.z = keptC; nl.d = newSize; }
    layers.push(nl);
    const cut = { x: prev.x, z: prev.z, w: prev.w, d: prev.d, h, vx: sign * 2.4, vy: -2.5, alpha: 1, axis: ax };
    if (ax === 'x') { cut.x = cutC; cut.w = ad; } else { cut.z = cutC; cut.d = ad; }
    falling.push(cut);
    score += 1;
    burst(nl.x, nl.z, h, 'rgba(255,255,255,.9)', 10);
    shake = 5;
    sfxPlace();
  }

  elScore.textContent = score;
  if (combo >= 2) { elCombo.textContent = 'PERFECT x' + combo; elCombo.style.opacity = 1; }
  else elCombo.style.opacity = 0;
  hue = (hue + 2.2) % 360;
  spawnBlock();
}

function burst(x, z, h, color, n) {
  const p = project(x, z, h);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
    parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
                 life: 0.7 + Math.random() * 0.5, maxLife: 1, color, size: 2 + Math.random() * 4 });
  }
}

/* ---------------- projection (dimetric) ---------------- */
let unit = 60, blockH = 25, cx = 0, COS = 0.866, SIN = 0.5;
function project(x, z, h) {
  const ox = (x * COS - z * COS) * unit;
  const oy = (x * SIN + z * SIN) * unit - (h - camY) * blockH;
  return { x: cx + ox, y: H * 0.72 + oy };
}
function blockColor(i, face) {
  const hh = (212 + i * 3.5) % 360;
  const l = face === 0 ? 62 : face === 1 ? 44 : 34; // top, left, right
  return 'hsl(' + hh + ',72%,' + l + '%)';
}
function drawBox(x, z, h, w, d, layerIdx, alpha) {
  const c = project(x, z, h);
  const exx = COS * unit, exy = SIN * unit;   // +x screen vector (per unit)
  const ezx = -COS * unit, ezy = SIN * unit;  // +z screen vector
  const hx = w / 2, hz = d / 2;
  const A = { x: c.x - hx * exx - hz * ezx, y: c.y - hx * exy - hz * ezy };
  const B = { x: c.x + hx * exx - hz * ezx, y: c.y + hx * exy - hz * ezy };
  const C = { x: c.x + hx * exx + hz * ezx, y: c.y + hx * exy + hz * ezy };
  const D = { x: c.x - hx * exx + hz * ezx, y: c.y - hx * exy + hz * ezy };
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  // left face (B-C edge)
  ctx.fillStyle = blockColor(layerIdx, 1);
  ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.lineTo(C.x, C.y);
  ctx.lineTo(C.x, C.y + blockH); ctx.lineTo(B.x, B.y + blockH); ctx.closePath(); ctx.fill();
  // right face (D-C edge)
  ctx.fillStyle = blockColor(layerIdx, 2);
  ctx.beginPath(); ctx.moveTo(D.x, D.y); ctx.lineTo(C.x, C.y);
  ctx.lineTo(C.x, C.y + blockH); ctx.lineTo(D.x, D.y + blockH); ctx.closePath(); ctx.fill();
  // top face
  ctx.fillStyle = blockColor(layerIdx, 0);
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y); ctx.closePath(); ctx.fill();
  // subtle top highlight
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ---------------- update ---------------- */
let last = performance.now();
function update(now) {
  let dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (mode === 'playing' && cur) {
    cur.pos += cur.dir * cur.speed * dt;
    if (cur.pos > RANGE)  { cur.pos = RANGE;  cur.dir = -1; }
    if (cur.pos < -RANGE) { cur.pos = -RANGE; cur.dir = 1; }
    syncCur();
  }
  // falling cut pieces
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i];
    f.vy += GRAV * dt;
    if (f.axis === 'x') f.x += f.vx * dt; else f.z += f.vx * dt;
    f.h -= f.vy * dt / blockH; // vy in px/s, h in layers
    f.alpha -= dt * 0.9;
    if (f.alpha <= 0 || f.h < camY - 8) falling.splice(i, 1);
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += 500 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  // rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += dt * 6; r.alpha -= dt * 1.6;
    if (r.alpha <= 0) rings.splice(i, 1);
  }
  // popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.life -= dt * 0.9; p.h += dt * 0.6;
    if (p.life <= 0) popups.splice(i, 1);
  }
  // camera follows tower top
  const target = Math.max(0, layers.length - 5);
  camY += (target - camY) * Math.min(1, dt * 3.2);
  // decay juice
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 1.8);

  if (mode === 'over' && overOverlay.classList.contains('hidden') && now - overAt > 650) {
    finalScore.textContent = score;
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('stackrush_best', String(best)); } catch (e) {} }
    finalBest.textContent = 'BEST ' + best;
    elBest.textContent = 'BEST ' + best;
    newBestEl.style.display = isBest && score > 0 ? 'block' : 'none';
    overOverlay.classList.remove('hidden');
  }
}

/* ---------------- render ---------------- */
function render() {
  unit = Math.min(W, H) / 6.4;
  blockH = unit * 0.42;
  cx = W / 2;

  // background: hue drifts as you climb
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'hsl(' + hue + ',45%,14%)');
  g.addColorStop(1, 'hsl(' + ((hue + 40) % 360) + ',50%,7%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // settled layers, bottom -> top (painter's order)
  const start = Math.max(0, Math.floor(camY) - 6);
  for (let i = start; i < layers.length; i++) {
    const L = layers[i];
    if (i - camY > 16) break; // cull above screen
    drawBox(L.x, L.z, i, L.w, L.d, i);
  }
  // moving block (slight glow)
  if (cur) {
    drawBox(cur.x, cur.z, layers.length, cur.w, cur.d, layers.length);
    const p = project(cur.x, cur.z, layers.length);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, unit * 1.5, unit * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  }
  // falling pieces
  for (const f of falling) {
    const idx = Math.max(0, Math.round(f.h));
    drawBox(f.x, f.z, f.h, f.w, f.d, idx, Math.max(0, f.alpha));
  }
  // rings
  for (const r of rings) {
    const p = project(r.x, r.z, r.h);
    ctx.globalAlpha = Math.max(0, r.alpha);
    ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, r.r * unit * 0.8, r.r * unit * 0.36, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // particles
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.font = '800 22px -apple-system, "Segoe UI", Roboto, sans-serif';
  for (const p of popups) {
    const sp = project(p.x, p.z, p.h);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    ctx.fillStyle = p.color;
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
    ctx.fillText(p.text, sp.x, sp.y - 40);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // perfect flash
  if (flash > 0) { ctx.fillStyle = 'rgba(255,240,200,' + (flash * 0.5).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }

  // first-taps hint while playing
  if (mode === 'playing' && tapCount < 3 && layers.length <= 3) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = '700 15px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('T A P', W / 2, H * 0.30 + Math.sin(performance.now() / 300) * 6);
  }
}

function loop(now) { update(now); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ---------------- input ---------------- */
function onTap(e) {
  if (e) { e.preventDefault(); audio(); }
  if (mode === 'menu') newGame();
  else if (mode === 'playing') place();
  else if (mode === 'over' && !overOverlay.classList.contains('hidden')) {
    if (performance.now() - overAt > 900) newGame();
  }
}
canvas.addEventListener('pointerdown', onTap);
menuOverlay.addEventListener('pointerdown', onTap);
overOverlay.addEventListener('pointerdown', onTap);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') onTap();
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
</body>
</html>
