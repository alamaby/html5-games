<script>

   Single-file HTML5 game. Sections follow DESIGN-MVP.md §10.

/* ============================ CONFIG ============================
   THE single tuning point (DESIGN-MVP.md §4.2). Change numbers here
   only — no other file, no other object. */
const CONFIG = {
  DOSE: 20,            // g coffee, fixed in MVP
  TARGET_WATER: 300,   // g, ratio 1:15
  MAX_WATER: 360,      // g, pouring past this = over-dilution

  AMBIENT: 78,         // °C idle target temp
  CHAN_V: 25,          // px/s — below this while pouring = dwelling
  CHAN_T: 1.2,         // sec of dwelling -> one channeling event (+0.2 C)
  AGIT_V: 900,         // px/s — above this = too rough
  WALL_R: 0.85,        // fraction of dripper radius — pouring past this = too rough
  TECH_VMIN: 60, TECH_VMAX: 700, // technique "good" velocity window
  TECH_RMIN: 0.15, TECH_RMAX: 0.85, // technique "good" radius window (fraction of Rd)
  AXIS_TOL: 12,        // default scoring tolerance per axis
  STAR3: 85, STAR2: 70, STAR1: 50, // star thresholds on total score
  // Tutorial tuning (DESIGN-MVP.md §13) — same single-point rule as everything above.
  TUT_BLOOM_WAIT: 5,   // sec — shortened bloom wait in tutorial step 1
  TUT_STEP2_TIME: 15,  // sec — pour time required in tutorial step 2
  TUT_STEP2_TECH: 60,  // % — technique required in tutorial step 2

/* ============================ I18N ============================ */
const I18N = {

  tut3_start: 'START SHIFT 1',
},
id: {
  tagline: 'Seduh dengan sentuhan. Setiap milidetik jarimu mengubah kimia di dalam cangkir.',
  startBrewing: 'MULAI MENYEDUH', achievements: 'PENCAPAIAN', howTo: 'CARA BERMAIN', back: 'KEMBALI',
  selectShift: 'PILIH SHIFT', locked: 'TERKUNCI', order: 'ORDER', of: 'dari',
  grind: 'Gilingan', water: 'Air', ratio: 'Rasio', target: 'Target', startBrew: 'MULAI SEDUH',
  fine: 'Halus', medium: 'Sedang', coarse: 'Kasar',
  bloomHint: 'TAHAN touchpad untuk menuang', bloomWait: 'Bloom… biarkan berdegas',
  extractHint: 'PUTAR! Jaga 18–22%', stop: 'STOP', technique: 'Teknik',
  extraction: 'Ekstraksi', temp: 'Suhu',
  chanWarn: 'Channeling! Terus bergerak!', roughWarn: 'Terlalu kasar!', floodWarn: 'Banjir! Bed tenggelam!',
  results: 'HASIL', total: 'Total', coins: 'koin', tip: 'Tip',

  tut3_start: 'MULAI SHIFT 1',

};
let lang = 'en';
function t(k, a2, a3) {
  let lng = lang, vars = null;
  if (typeof a2 === 'string') lng = a2; else if (a2) vars = a2;
  if (typeof a3 === 'string') lng = a3;
  let s = (I18N[lng] && I18N[lng][k] !== undefined) ? I18N[lng][k] : (I18N.en[k] !== undefined ? I18N.en[k] : k);
  if (vars) for (const key in vars) s = String(s).split('{' + key + '}').join(String(vars[key]));
  return s;
}
function setLang(l) {
  if (l !== 'en' && l !== 'id') return;
  lang = l;
  try { document.documentElement.lang = l; } catch (e) {}
  if (save) { save.lang = l; persist(); }
  applyLang();
}
function getLang() { return lang; }

/* ============================ SAVE ============================ */
const SAVE_KEY = 'pp_save_v1';
function defaultSave() {
  return { lang: 'en', muted: false, unlocked: 1, stars: {}, coins: 0, ach: {}, bestTech: 0,
           tutorialDone: false };
}
let save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const d = defaultSave();
      for (const k in d) if (s[k] !== undefined) d[k] = s[k];
      return d;
    }
  } catch (e) {}
  return defaultSave();
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}

/* ============================ SIM (pure logic) ============================
   All flavor math lives here as pure functions — used by the game AND the
   headless tests (window.__PP_TEST__). Formulas per DESIGN-MVP.md §4.4–4.5. */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

/* Pre-penalty flavors from extraction E (%). Returns {acidity, sweetness, bitterness}. */
function flavorAt(E) {
  return {
    acidity:    100 * Math.exp(-Math.pow((E - 8) / 9, 2)),
    sweetness:  100 * Math.exp(-Math.pow((E - 20) / 7, 2)),
    bitterness: 100 / (1 + Math.exp(-(E - 24) / 2.5)),
  };
}
/* Pre-penalty body from ratio R (water/dose), grind key, extraction E. */
function bodyAt(R, grind, E) {
  const gb = CONFIG.GRIND_BODY[grind] !== undefined ? CONFIG.GRIND_BODY[grind] : 1;
  return 100 * clamp((22 - R) / 10, 0.15, 1) * gb * clamp(E / 18, 0.4, 1);
}
/* Apply channeling (C), agitation (G) and flooding penalties. f has 4 axes. */
function applyPenalties(f, C, G, flooding) {
  return {
    acidity:    clamp(f.acidity + 22 * C, 0, 100),
    sweetness:  f.sweetness * (1 - 0.25 * C),
    bitterness: clamp(f.bitterness + 18 * C + 20 * G, 0, 100),
    body:       f.body * (1 - 0.2 * C) * (flooding ? 0.8 : 1),
  };
}
/* Per-axis score vs customer target zone. */
function scoreAxis(actual, target, tol) {
  const over = Math.max(0, Math.abs(actual - target) - tol);
  return Math.max(0, 100 - over * 2.5);
}
/* Full order scoring. o = {E, W, grind, C, G, flooding, cust}. */
function scoreOrder(o) {
  const f0 = flavorAt(o.E);
  const R = o.W / CONFIG.DOSE;
  const pre = { acidity: f0.acidity, sweetness: f0.sweetness, bitterness: f0.bitterness,
                body: bodyAt(R, o.grind, o.E) };
  const flav = applyPenalties(pre, o.C || 0, o.G || 0, !!o.flooding);
  const tg = o.cust.target, tol = o.cust.tol !== undefined ? o.cust.tol : CONFIG.AXIS_TOL;
  const axis = {
    a:    scoreAxis(flav.acidity, tg.a, tol),
    s:    scoreAxis(flav.sweetness, tg.s, tol),
    b:    scoreAxis(flav.bitterness, tg.b, tol),
    body: scoreAxis(flav.body, tg.body, tol),
  };
  const total = (axis.a + axis.s + axis.b + axis.body) / 4;
  const stars = total >= CONFIG.STAR3 ? 3 : total >= CONFIG.STAR2 ? 2 : total >= CONFIG.STAR1 ? 1 : 0;
  return { flav, axis, total, stars, R };
}

/* ============================ AUDIO ============================
   All procedural WebAudio (DESIGN-MVP.md §6). No assets. Every entry is
   guarded — the game runs fine with no AudioContext (headless tests). */
let ac = null, pourGain = null, pourFilter = null;
function audio() {
  try {
    if (muted || cgAudioMuted || sdkForceMute) return null;
    if (!ac) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      ac = new Ctor();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function audioUnlock() { try { audio(); } catch (e) {} }
function ensurePourNodes() {
  const a = audio(); if (!a || pourGain) return;
  try {
    const len = a.sampleRate | 0;
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
    pourFilter = a.createBiquadFilter(); pourFilter.type = 'bandpass';
    pourFilter.frequency.value = 800; pourFilter.Q.value = 1.1;
    pourGain = a.createGain(); pourGain.gain.value = 0.0001;
    src.connect(pourFilter); pourFilter.connect(pourGain); pourGain.connect(a.destination);
    src.start();
  } catch (e) {}
}
/* Pour loop: gain follows pourOn, bandpass freq follows pour radius
   (center stream = deeper tone). */
function audioPour(on, rr) {
  ensurePourNodes();
  if (!ac || !pourGain) return;
  try {
    const t = ac.currentTime;
    pourGain.gain.setTargetAtTime(on ? 0.13 : 0.0001, t, 0.06);
    if (on) pourFilter.frequency.setTargetAtTime(900 - 500 * clamp(rr || 0, 0, 1), t, 0.08);
  } catch (e) {}
}
function tone(freq, dur, type, vol) {
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function sfxBlip()  { tone(600 + Math.random() * 300, 0.09, 'sine', 0.10); } // bloom bubble
function sfxWarn()  { tone(180, 0.13, 'square', 0.09); }                     // channeling/rough
function sfxClick() { tone(1250, 0.05, 'sine', 0.08); }
function sfxChime() {
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99].forEach((f, i) => {
    setTimeout(() => tone(f, 0.35, 'triangle', 0.13), i * 120);
  });
}
/* Cosmetic-only vibration (Android). NEVER a gameplay signal — all feedback
   is visual (canvas shake + red ring), per DESIGN-MVP.md §8. */
function buzz(pat) { try { if (navigator.vibrate) navigator.vibrate(pat); } catch (e) {} }

/* ============================ INPUT ============================
   Relative-mode touchpad (DESIGN-MVP.md §3): only pointer DELTAS move the
   pour cursor — no jumps on touch-down. Secondary pointers ignored. */
const $ = (id) => document.getElementById(id);
const tp = $('touchpad');
let activePid = null, lastPX = 0, lastPY = 0, lastMT = 0;
function inputDown(e) {
  if (activePid !== null) return;                 // ignore secondary pointers
  activePid = e.pointerId;
  try { tp.setPointerCapture(e.pointerId); } catch (err) {}
  lastPX = e.clientX; lastPY = e.clientY; lastMT = e.timeStamp || performance.now();
  if (S && (mode === 'bloom_pour' || mode === 'extract')) { S.pourOn = true; S.v = 0; }
  audioUnlock();
  if (e.cancelable) e.preventDefault();
}
function inputMove(e) {
  if (e.pointerId !== activePid || !S) return;
  const now = e.timeStamp || performance.now();
  const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  const dtm = Math.max(1, now - lastMT) / 1000;
  lastPX = e.clientX; lastPY = e.clientY; lastMT = now;
  if (mode !== 'bloom_pour' && mode !== 'extract') return;
  S.cx = clamp(S.cx + dx, -S.Rd, S.Rd);
  S.cy = clamp(S.cy + dy, -S.Rd, S.Rd);
  const rl = Math.hypot(S.cx, S.cy);
  if (rl > S.Rd) { S.cx *= S.Rd / rl; S.cy *= S.Rd / rl; }
  S.r = Math.hypot(S.cx, S.cy);
  const iv = Math.hypot(dx, dy) / dtm;
  S.v = S.v + 0.25 * (iv - S.v);                  // EMA α=0.25
  if (e.cancelable) e.preventDefault();
}
function inputUp(e) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  if (S) S.pourOn = false;
}
tp.addEventListener('pointerdown', inputDown);
tp.addEventListener('pointermove', inputMove);
tp.addEventListener('pointerup', inputUp);
tp.addEventListener('pointercancel', inputUp);
// The STOP button lives inside the touchpad: its own tap must NOT start a pour.
$('stopBtn').addEventListener('pointerdown', (e) => e.stopPropagation());
$('stopBtn').addEventListener('click', (e) => { e.stopPropagation(); sfxClick(); finishOrder(); });

/* ============================ SIM ============================
   Per-frame update (DESIGN-MVP.md §4.3). dt in seconds. */
function newOrderState(spec) {
  return {
    mode: 'bloom_pour',
    grind: spec.g,
    E: 0, W: 0, T: spec.t - 6,      // slurry starts cooler than the kettle
    wet: 0, bed: 0, flooding: false,
    C: 0, G: 0, pourOn: false,
    v: 0, r: 0, cx: 0, cy: 0, Rd: L.Rd,
    dwell: 0, chanEvents: 0, chanMarks: [],
    pourT: 0, goodT: 0,
    bloomT: 0, blipT: 0,
    ripples: [], drops: [], bubbles: [],
    warnKey: null, warnT: 0, shakeT: 0, agitNow: false,
    t0: performance.now(),
  };
}
function flashWarn(key) {
  if (!S) return;
  if (S.warnKey !== key || S.warnT <= 0) { S.warnKey = key; S.warnT = 1.6; sfxWarn(); }
}
function simUpdate(dt) {
  const o = S;
  // 1. Water & bed
  const pouring = o.pourOn && o.mode !== 'bloom_wait';
  if (pouring && o.W < CONFIG.MAX_WATER) o.W += CONFIG.POUR_RATE * dt;
  o.wet = Math.min(1, o.W / CONFIG.BLOOM_WATER);
  o.bed += ((pouring ? CONFIG.POUR_RATE : 0) - CONFIG.DRAWDOWN[o.grind]) * dt;
  if (o.bed < 0) o.bed = 0;
  o.flooding = o.bed > CONFIG.BED_MAX;
  if (o.flooding && o.mode === 'extract') flashWarn('floodWarn');
  // 2. Temperature
  const tgt = pouring ? CONFIG.POUR_TEMP : CONFIG.AMBIENT;
  o.T += (tgt - o.T) * (pouring ? 1.5 : 0.25) * dt;
  if (o.agitNow) o.T -= 0.15 * dt;
  // velocity decay when the finger rests (no move events)
  if (o.pourOn && performance.now() - lastMT > 120) o.v *= Math.exp(-8 * dt);
  // 3. Extraction
  const tempF = 0.55 + 0.45 * clamp((o.T - 85) / 10, 0, 1);
  const flowF = pouring ? 1.0 : 0.35;
  const floodF = o.flooding ? 0.6 : 1.0;
  o.E = Math.min(30, o.E + CONFIG.EXT_BASE * o.wet * tempF *
                 CONFIG.GRIND_EXT[o.grind] * flowF * floodF * dt);
  // droplets + ripples while pouring
  if (pouring) {
    if (Math.random() < dt * 22)
      o.drops.push({ x: o.cx + (Math.random() - 0.5) * 14, y: o.cy + (Math.random() - 0.5) * 14, life: 0.5 });
    if (Math.random() < dt * 9)
      o.ripples.push({ x: o.cx, y: o.cy, r: 4, life: 0.8 });
  }
  for (let i = o.drops.length - 1; i >= 0; i--) { o.drops[i].life -= dt; if (o.drops[i].life <= 0) o.drops.splice(i, 1); }
  for (let i = o.ripples.length - 1; i >= 0; i--) {
    const rp = o.ripples[i]; rp.life -= dt; rp.r += dt * 46;
    if (rp.life <= 0) o.ripples.splice(i, 1);
  }
  // 4-5. Channeling & agitation (extraction phase only)
  o.agitNow = false;
  if (o.mode === 'extract' && o.pourOn) {
    if (o.v < CONFIG.CHAN_V) o.dwell += dt; else o.dwell = 0;
    if (o.dwell > CONFIG.CHAN_T) {
      o.C = Math.min(1, o.C + 0.2); o.dwell = 0; o.chanEvents++;
      o.chanMarks.push({ x: o.cx, y: o.cy });
      o.shakeT = 0.3; flashWarn('chanWarn'); buzz(30);
      if (o.chanEvents >= 3) unlockAch('channel_chaos');
      if (tutorialMode && tutStep === 2 && !tutWarnedChan) {
        tutWarnedChan = true; coachSay('tut2_warn_channel', 4);
      }
    }
    o.agitNow = (o.v > CONFIG.AGIT_V || o.r > CONFIG.WALL_R * o.Rd);
    if (o.agitNow) {
      o.G = Math.min(1, o.G + 0.3 * dt);
      o.shakeT = Math.max(o.shakeT, 0.12);
      flashWarn('roughWarn');
      if (o.G >= 1) { unlockAch('astringent'); buzz([30, 50, 30]); }
      if (tutorialMode && tutStep === 2 && !tutWarnedAgit) {
        tutWarnedAgit = true; coachSay('tut2_warn_agitation', 4);
      }
    }
    // 6. Technique
    o.pourT += dt;
    if (o.v > CONFIG.TECH_VMIN && o.v < CONFIG.TECH_VMAX &&
        o.r > CONFIG.TECH_RMIN * o.Rd && o.r < CONFIG.TECH_RMAX * o.Rd) o.goodT += dt;
  }
  // bloom transitions (module `mode` tracks S.mode so finishOrder()'s guard works)
  if (o.mode === 'bloom_pour' && o.W >= CONFIG.BLOOM_WATER) {
    o.mode = 'bloom_wait'; mode = 'bloom_wait';
    o.bloomT = (tutorialMode && tutStep === 1) ? CONFIG.TUT_BLOOM_WAIT : CONFIG.BLOOM_WAIT;
    o.pourOn = false;
    unlockAch('first_bloom'); refreshTpHint();
    if (tutorialMode && tutStep === 1) { coachShow(1, 'tut1_done'); tutChrome(); }
  }
  if (o.mode === 'bloom_wait') {
    o.bloomT -= dt; o.blipT -= dt;
    if (o.blipT <= 0) {
      o.blipT = 0.2 + Math.random() * 0.3; sfxBlip();
      const a = Math.random() * Math.PI * 2, rr = Math.random() * o.Rd * 0.8;
      o.bubbles.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr, r: 2 + Math.random() * 4, life: 0.9 });
    }
    for (let i = o.bubbles.length - 1; i >= 0; i--) {
      const b = o.bubbles[i]; b.life -= dt; b.y -= dt * 12;
      if (b.life <= 0) o.bubbles.splice(i, 1);
    }
    if (o.bloomT <= 0) {
      o.mode = 'extract'; mode = 'extract'; refreshTpHint();
      if (tutorialMode && tutStep === 1) { tutStep = 2; coachShow(2, 'tut2_coach'); tutChrome(); }
    }
  }
  if (o.mode === 'extract' && o.W >= CONFIG.MAX_WATER) finishOrder(); // auto-stop
  if (o.warnT > 0) o.warnT -= dt;
  if (o.shakeT > 0) o.shakeT -= dt;
  audioPour(o.pourOn && (o.mode === 'bloom_pour' || o.mode === 'extract') && !paused && !adPaused, o.r / o.Rd);
  updateTechBar();
}

/* 4-axis radar. axes order: acidity(top) sweetness(right) bitterness(bottom) body(left). */
function drawRadar(c, cx, cy, R, target, result, labels) {
  const pts = (vals) => {
    const p = [];
    const arr = [vals.a, vals.s, vals.b, vals.body];
    for (let i = 0; i < 4; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 2;
      const rr = R * clamp(arr[i] / 100, 0, 1);
      p.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
    }
    return p;
  };
  const poly = (p, fill, stroke) => {
    c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]));
    c.closePath(); c.fillStyle = fill; c.fill();
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 2; c.stroke(); }
  };
  // grid
  c.strokeStyle = 'rgba(255,224,138,.18)'; c.lineWidth = 1;
  [0.33, 0.66, 1].forEach(f => {
    c.beginPath();
    for (let i = 0; i <= 4; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 2;
      const x = cx + Math.cos(ang) * R * f, y = cy + Math.sin(ang) * R * f;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.stroke();
  });
  for (let i = 0; i < 4; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 2;
    c.beginPath(); c.moveTo(cx, cy);
    c.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); c.stroke();
  }
  if (target) poly(pts(target), 'rgba(255,224,138,.22)', 'rgba(255,224,138,.8)');
  if (result) poly(pts(result), 'rgba(255,140,60,.55)', '#ff8a3c');
  if (labels) {
    c.fillStyle = '#f5e9d6'; c.font = '700 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const names = [labels.a, labels.s, labels.b, labels.body];
    for (let i = 0; i < 4; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 2;
      c.fillText(names[i], cx + Math.cos(ang) * (R + 22), cy + Math.sin(ang) * (R + 22));
    }
  }
}
function radarLabels() { return { a: t('acidity'), s: t('sweetness'), b: t('bitterness'), body: t('body') }; }

function bedColor(E) {
  const k = clamp(E / 28, 0, 1);
  const r = Math.round(217 + (74 - 217) * k), g = Math.round(179 + (44 - 179) * k), b = Math.round(130 + (23 - 130) * k);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function drawDripper(nowS) {
  const { dcx, dcy, Rd } = L, o = S;
  ctx.save();
  if (o.shakeT > 0) ctx.translate((Math.random() - 0.5) * 10 * o.shakeT * 3, (Math.random() - 0.5) * 10 * o.shakeT * 3);
  // stand + ring
  ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 1.14, 0, 7); ctx.fillStyle = '#241a10'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#6b4f2e'; ctx.stroke();
  // paper filter
  ctx.beginPath(); ctx.arc(dcx, dcy, Rd, 0, 7); ctx.fillStyle = '#e6d9bd'; ctx.fill();
  // coffee bed (color follows extraction — always paired with the % number in HUD)
  ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 0.92, 0, 7); ctx.fillStyle = bedColor(o.E); ctx.fill();
  // bed texture (stable pseudo-random dots)
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  for (let i = 0; i < 40; i++) {
    const a = (i * 2.39996) % (Math.PI * 2), rr = Rd * 0.88 * ((i * 0.61803) % 1);
    ctx.beginPath(); ctx.arc(dcx + Math.cos(a) * rr, dcy + Math.sin(a) * rr, 2.2, 0, 7); ctx.fill();
  }
  // water layer
  if (o.bed > 2) {
    ctx.globalAlpha = clamp(0.18 + o.bed / CONFIG.BED_MAX * 0.3, 0, 0.5);
    ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 0.92, 0, 7); ctx.fillStyle = '#7a5230'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  // channeling holes
  o.chanMarks.forEach(m => {
    ctx.beginPath(); ctx.arc(dcx + m.x, dcy + m.y, 11, 0, 7);
    ctx.fillStyle = 'rgba(20,10,5,.75)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,80,40,.7)'; ctx.stroke();
  });
  // spiral guide (extraction phase) — bright + animated in tutorial step 2
  if (o.mode === 'extract') {
    const tut = tutorialMode && tutStep === 2;
    ctx.save(); ctx.setLineDash([6, 8]);
    if (tut) { try { ctx.lineDashOffset = -nowS * 30; } catch (e) {} }
    ctx.strokeStyle = tut ? 'rgba(255,224,138,.9)' : 'rgba(255,255,255,.28)';
    ctx.lineWidth = tut ? 4 : 2;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 7; a += 0.08) {
      const rr = Rd * 0.85 * a / (Math.PI * 7);
      const x = dcx + Math.cos(a) * rr, y = dcy + Math.sin(a) * rr;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
  // bloom bubbles
  o.bubbles.forEach(b => {
    ctx.globalAlpha = clamp(b.life, 0, 1) * 0.8;
    ctx.beginPath(); ctx.arc(dcx + b.x, dcy + b.y, b.r, 0, 7);
    ctx.strokeStyle = '#fff3d6'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.globalAlpha = 1;
  });
  // ripples + droplets at pour cursor
  o.ripples.forEach(rp => {
    ctx.globalAlpha = clamp(rp.life * 1.4, 0, 1) * 0.7;
    ctx.beginPath(); ctx.arc(dcx + rp.x, dcy + rp.y, rp.r, 0, 7);
    ctx.strokeStyle = '#cfe8ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  });
  o.drops.forEach(dr => {
    ctx.globalAlpha = clamp(dr.life * 2, 0, 1);
    ctx.beginPath(); ctx.arc(dcx + dr.x, dcy + dr.y, 3, 0, 7);
    ctx.fillStyle = '#bfe0ff'; ctx.fill(); ctx.globalAlpha = 1;
  });
  // pour cursor (offset cursor — the finger is on the touchpad below)
  if (o.mode === 'extract' || o.mode === 'bloom_pour') {
    const px = dcx + o.cx, py = dcy + o.cy;
    ctx.beginPath(); ctx.arc(px, py, 9, 0, 7);
    ctx.fillStyle = o.pourOn ? '#bfe0ff' : 'rgba(191,224,255,.45)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  // steam when hot
  if (o.T > 88) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + 0.10 * (o.T - 88) / 8) + ')';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const sx = dcx + (i - 1) * Rd * 0.4;
      ctx.beginPath();
      for (let y = 0; y <= 44; y += 6)
        ctx.lineTo(sx + Math.sin(y / 10 + nowS * 2 + i * 2) * 7, dcy - Rd * 1.2 - y);
      ctx.stroke();
    }
  }
  // red agitation ring (visual signal — vibration is cosmetic-only)
  if (o.G > 0.03) {
    ctx.globalAlpha = clamp(o.G, 0, 1) * (0.55 + 0.35 * Math.sin(nowS * 10));
    ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 1.06, 0, 7);
    ctx.lineWidth = 6; ctx.strokeStyle = '#ff3b30'; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawHUD() {
  const o = S, pad = 16, y0 = 46;
  ctx.textBaseline = 'alphabetic';
  // left: extraction number (ALWAYS numeric — anti-frustration rule)
  ctx.textAlign = 'left'; ctx.fillStyle = '#8a7358'; ctx.font = '700 11px sans-serif';
  ctx.fillText(t('extraction').toUpperCase(), pad, y0);
  ctx.fillStyle = '#ffe08a'; ctx.font = '800 40px sans-serif';
  ctx.fillText(o.E.toFixed(1) + '%', pad, y0 + 42);
  // sweet-spot bar under the number
  const bx = pad, bw = W * 0.52, by = y0 + 54;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx, by, bw, 10);
  const sx = bx + bw * (18 / 30), sw = bw * (4 / 30);
  ctx.fillStyle = 'rgba(120,220,120,.55)'; ctx.fillRect(sx, by, sw, 10);
  const mx = bx + bw * clamp(o.E / 30, 0, 1);
  ctx.fillStyle = '#fff'; ctx.fillRect(mx - 1.5, by - 4, 3, 18);
  ctx.fillStyle = '#8a7358'; ctx.font = '700 10px sans-serif';
  ctx.fillText('18–22%', sx - 8, by + 24);
  // right: mini target radar (hidden in tutorial — no customer yet) + live chips
  if (!tutorialMode) {
    const cust = CUSTOMERS[curSpec().c];
    drawRadar(ctx, W - 62, y0 + 42, 44, cust.target, null, null);
  }
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5e9d6'; ctx.font = '700 13px sans-serif';
  const cx0 = W - 122;
  ctx.fillText('🌡 ' + o.T.toFixed(0) + '°C', cx0, y0 + 14);
  ctx.fillText('⚖ ' + Math.round(o.W) + 'g', cx0, y0 + 34);
  const tech = o.pourT > 0 ? Math.round(100 * o.goodT / o.pourT) : 100;
  ctx.fillStyle = tech >= 80 ? '#8fd18f' : tech >= 50 ? '#ffe08a' : '#ff8a5c';
  ctx.fillText('🎯 ' + tech + '%', cx0, y0 + 54);
  if (o.mode === 'bloom_pour') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe08a'; ctx.font = '800 15px sans-serif';
    ctx.fillText(Math.round(o.W) + 'g / ' + CONFIG.BLOOM_WATER + 'g', W / 2, L.infoH + L.midH + 24);
  }
  if (o.mode === 'bloom_wait') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe08a'; ctx.font = '800 22px sans-serif';
    ctx.fillText(t('bloomWait'), W / 2, L.dcy);
    ctx.font = '800 44px sans-serif';
    ctx.fillText(Math.ceil(o.bloomT), W / 2, L.dcy + 52);
  }
}
function drawWarn() {
  if (!S || S.warnT <= 0 || !S.warnKey) return;
  const msg = t(S.warnKey);
  ctx.font = '800 15px sans-serif';
  const wpx = ctx.measureText(msg).width + 36;
  const x = W / 2 - wpx / 2, y = L.infoH + 8;
  ctx.globalAlpha = clamp(S.warnT, 0, 1);
  ctx.fillStyle = 'rgba(160,30,20,.92)'; ctx.fillRect(x, y, wpx, 34);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, y + 23);
  ctx.globalAlpha = 1;
}
function drawMenuBackdrop(nowS) {
  // calm idle dripper behind the menu overlay
  const Rd = L.Rd, dcx = L.dcx, dcy = L.dcy;
  ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 1.14, 0, 7); ctx.fillStyle = 'rgba(36,26,16,.8)'; ctx.fill();
  ctx.beginPath(); ctx.arc(dcx, dcy, Rd * 0.92, 0, 7); ctx.fillStyle = bedColor(12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const sx = dcx + (i - 1) * Rd * 0.4;
    ctx.beginPath();
    for (let y = 0; y <= 44; y += 6)
      ctx.lineTo(sx + Math.sin(y / 10 + nowS * 1.5 + i * 2) * 7, dcy - Rd * 1.2 - y);
    ctx.stroke();
  }
}
function render(nowS) {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#251a10'); bg.addColorStop(1, '#100c07');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (!S) { drawMenuBackdrop(nowS); return; }
  drawDripper(nowS);
  if (mode === 'bloom_pour' || mode === 'bloom_wait' || mode === 'extract') drawHUD();

}

function finishOrder() {
  if (mode !== 'extract' || !S) return;
  if (tutorialMode) { finishTutorial(); return; } // no stars/coins in tutorial
  mode = 'result';
  S.pourOn = false; audioPour(false);
  $('touchpad').classList.add('hidden');
  const spec = curSpec(), cust = CUSTOMERS[spec.c];
  const res = scoreOrder({ E: S.E, W: S.W, grind: S.grind, C: S.C, G: S.G, flooding: S.flooding, cust });
  res.tech = S.pourT > 0 ? 100 * S.goodT / S.pourT : 0;
  res.E = S.E; res.W = S.W; res.grind = S.grind;
  res.cust = cust; res.timeS = (performance.now() - S.t0) / 1000;
  lastResult = res;
  if (S.E >= 18 && S.E <= 22) unlockAch('sweet_spot');
  if (res.tech >= 95 && S.C === 0 && S.pourT > 3) unlockAch('surgeon');
  if (res.stars === 3) { unlockAch('triple_star'); CG.happytime(); }
  if (res.timeS < 60 && res.stars >= 2) unlockAch('speed_barista');
  const key = 's' + curShift + 'o' + curOrder;
  if (res.stars > (save.stars[key] || 0)) save.stars[key] = res.stars;
  const coins = 10 + res.stars * 5 + Math.round(res.tech * 0.1);
  save.coins += coins;
  if (Math.round(res.tech) > save.bestTech) save.bestTech = Math.round(res.tech);
  let ps = true;
  for (let i = 0; i < 4; i++) if ((save.stars['s' + curShift + 'o' + i] || 0) < 3) ps = false;
  if (ps) unlockAch('perfect_shift');
  persist();
  CG.gameplayStop();
  showResult(res, coins);
}

    $('skipBtn').textContent = t('tut_skip');
  }
  refreshTpHint();
}

/* ---- UI wiring ---- */
$('brewBtn').addEventListener('click', onBrewPress);
$('menuTutBtn').addEventListener('click', () => { sfxClick(); startTutorial(); });
$('skipBtn').addEventListener('click', () => { sfxClick(); skipTutorial(); });
$('tutStartBtn').addEventListener('click', onTutStart);
$('menuAchBtn').addEventListener('click', () => { sfxClick(); showAch(); });
$('menuHelpBtn').addEventListener('click', () => { sfxClick(); showHelp(); });
$('shiftBack').addEventListener('click', () => { sfxClick(); showMenu(); });
$('orderBack').addEventListener('click', () => { sfxClick(); showShifts(); });
$('startBrewBtn').addEventListener('click', () => { sfxClick(); startBrew(); });
$('nextBtn').addEventListener('click', () => {
  sfxClick();
  if (curOrder < 3) { curOrder++; showOrder(); } else shiftDone();
});
$('retryBtn').addEventListener('click', () => { sfxClick(); showOrder(); });
$('shareBtn').addEventListener('click', () => { sfxClick(); shareCard(); });
$('sdContinue').addEventListener('click', () => { sfxClick(); Ads.midroll(() => showShifts()); });
$('achBack').addEventListener('click', () => { sfxClick(); showMenu(); });
$('helpBack').addEventListener('click', () => { sfxClick(); showMenu(); });
$('langBtn').addEventListener('click', () => { sfxClick(); setLang(lang === 'en' ? 'id' : 'en'); });
$('soundBtn').addEventListener('click', () => {
  if (sdkForceMute) { showToast('<span class="t-ico">🔇</span><span>' + t('audioLocked') + '</span>'); return; }
  muted = !muted; save.muted = muted; persist(); refreshSoundBtn();
  if (muted) audioPour(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { paused = true; if (S) S.pourOn = false; audioPour(false); }
  else { paused = false; lastMT = performance.now(); }
});

/* ============================ TUTORIAL ============================
   3-step teach-by-doing (DESIGN-MVP.md §13). Reuses the brew screen via the
   tutorialMode flag + a step state machine. Coach overlay is a DOM div above
   the canvas; all strings go through t() (bilingual, no hardcode). */
let tutorialMode = false, tutStep = 0;
let tutCoachKey = null, tutSayKey = null, tutSayT = 0;
let tutWarnedChan = false, tutWarnedAgit = false;

function coachShow(step, key) {
  tutCoachKey = key; tutSayT = 0; tutSayKey = null;
  $('coach').classList.remove('hidden');
  $('coachStep').textContent = t('tut_step', { a: step });
  $('coachText').textContent = t(key);
  $('skipBtn').textContent = t('tut_skip');
}
/* Transient explanation (e.g. first channeling) — restores the step's
   coach text after `secs` seconds. */
function coachSay(key, secs) {
  tutSayKey = key; tutSayT = secs;
  $('coachText').textContent = t(key);
}
function coachHide() {
  $('coach').classList.add('hidden');
  $('touchpad').classList.remove('pulse');
  $('stopBtn').classList.remove('pulseBtn');
}
/* Step chrome: touchpad pulse on step 1, stop button hidden until step 3. */
function tutChrome() {
  if (tutorialMode && tutStep === 1) $('touchpad').classList.add('pulse');
  else $('touchpad').classList.remove('pulse');
  if (tutorialMode && S && tutStep < 3) $('stopBtn').style.display = 'none';
  else if (S && S.mode === 'extract') { $('stopBtn').style.display = ''; }
}
function startTutorial() {
  tutorialMode = true; tutStep = 1;
  tutWarnedChan = false; tutWarnedAgit = false;
  S = newOrderState({ g: 'medium', t: 94 }); // neutral spec — no customer, no score
  runUnlocks = [];
  mode = 'bloom_pour';
  showOverlay(null);
  $('touchpad').classList.remove('hidden');
  coachShow(1, 'tut1_coach');
  tutChrome();
  refreshTpHint(); updateTechBar();
  CG.gameplayStart();
}
/* Tutorial exit: brand-new players drop straight into Shift 1 Order 1;
   players with existing progress return to the shift map instead of
   being yanked back to the start. */
function tutExit() {
  save.tutorialDone = true; persist();
  if (totalStars() === 0 && save.unlocked <= 1) { curShift = 0; curOrder = 0; showOrder(); }
  else showShifts();
}
/* Skip: frictionless — no confirm. */
function skipTutorial() {
  if (!tutorialMode) return;
  tutorialMode = false;
  if (S) S.pourOn = false;
  S = null; audioPour(false);
  coachHide();
  $('touchpad').classList.add('hidden');
  CG.gameplayStop();
  tutExit();
}
function finishTutorial() {
  mode = 'tutdone';
  S.pourOn = false; audioPour(false);
  $('touchpad').classList.add('hidden');
  coachHide();
  CG.gameplayStop();
  const f0 = flavorAt(S.E), R = S.W / CONFIG.DOSE;
  const flav = applyPenalties(
    { acidity: f0.acidity, sweetness: f0.sweetness, bitterness: f0.bitterness,
      body: bodyAt(R, S.grind, S.E) },
    S.C, S.G, S.flooding);
  const tc = $('tutRadar').getContext('2d');
  if (tc) {
    tc.clearRect(0, 0, 240, 240);
    drawRadar(tc, 120, 120, 84, null,
      { a: flav.acidity, s: flav.sweetness, b: flav.bitterness, body: flav.body },
      radarLabels());
  }
  $('tutRadarCoach').textContent = t('tut3_radar');
  $('tutStartBtn').textContent = (totalStars() === 0 && save.unlocked <= 1) ? t('tut3_start') : t('continue');
  tutorialMode = false;
  showOverlay('tutDoneOverlay');
}
function onTutStart() {
  sfxClick();
  tutExit();
}
/* Per-frame tutorial logic: transient coach timer, step-2 objective,
   step-3 stop-button pulse in the sweet zone. */
function tutTick(dt) {
  if (tutSayT > 0) {
    tutSayT -= dt;
    if (tutSayT <= 0) { tutSayT = 0; $('coachText').textContent = t(tutCoachKey); }
  }
  if (tutStep === 2 && S && S.mode === 'extract') {
    const tech = S.pourT > 0 ? S.goodT / S.pourT : 0;
    if ((S.pourT >= CONFIG.TUT_STEP2_TIME && tech >= CONFIG.TUT_STEP2_TECH / 100) ||
        S.E >= CONFIG.TUT_STEP2_E) {
      tutStep = 3; coachShow(3, 'tut3_coach'); tutChrome(); refreshTpHint();
    }
  }
  const inZone = tutStep === 3 && S && S.mode === 'extract' && S.E >= 18 && S.E <= 22;
  if (inZone) $('stopBtn').classList.add('pulseBtn');
  else $('stopBtn').classList.remove('pulseBtn');
}
/* Main-menu PLAY: first run goes to the tutorial, afterwards to shifts. */
function onBrewPress() {
  sfxClick();
  if (!save.tutorialDone) startTutorial();
  else showShifts();
}

/* ============================ SDK ============================
   CrazyGames SDK v3 adapter — same verified pattern as tower-rush.
   gameplayStart on order start · gameplayStop on results ·
   happytime on ★★★ · midroll ONLY between shifts (never mid-order).
   All ad calls go through Ads.midroll so a GameDistribution variant
   is a one-line swap later. */
const CG = {
  ready: false, sdk: null, _ready: null,
  _call(fn) {
    if (!this._ready) return;
    this._ready.then(ok => { try { if (ok && this.sdk) fn(this.sdk); } catch (e) {} });
  },
  init() {
    this._ready = (async () => {
      let Sdk = null;
      try { Sdk = window.CrazyGames && window.CrazyGames.SDK; } catch (e) { return false; }
      if (!Sdk || typeof Sdk.init !== 'function') return false;
      try { await Sdk.init(); } catch (e) { return false; }
      let env = null;
      try { env = Sdk.environment; } catch (e) {}
      if (env === 'disabled') return false;
      this.sdk = Sdk; this.ready = true;
      try {
        const gm = Sdk.game;
        if (gm && gm.settings && gm.settings.muteAudio === true) {
          sdkForceMute = true; muted = true; refreshSoundBtn();
        }
        if (gm && typeof gm.addSettingsChangeListener === 'function') {
          gm.addSettingsChangeListener((ns) => {
            if (ns && typeof ns.muteAudio === 'boolean') {
              sdkForceMute = ns.muteAudio;
              if (ns.muteAudio) muted = true;
              refreshSoundBtn();
            }
          });
        }
      } catch (e) {}
      return true;
    })();
    return this._ready;
  },
  gameplayStart() { this._call(s => s.game.gameplayStart()); },
  gameplayStop()  { this._call(s => s.game.gameplayStop()); },
  happytime()     { this._call(s => s.game.happytime()); },
  midroll(onDone) {
    const done = () => { try { onDone && onDone(); } catch (e) {} };
    let settled = false;
    const finish = () => {
      if (settled) return; settled = true;
      adPaused = false; cgAudioMuted = false; done();
    };
    const watchdog = setTimeout(finish, 8000); // never trap the player
    const run = () => {
      try {
        this.sdk.ad.requestAd('midgame', {
          adStarted:  () => { adPaused = true; cgAudioMuted = true; audioPour(false); },
          adFinished: () => { clearTimeout(watchdog); finish(); },
          adError:    () => { clearTimeout(watchdog); finish(); },
        });
      } catch (e) { clearTimeout(watchdog); finish(); }
    };
    if (!this._ready) { clearTimeout(watchdog); finish(); return; }
    this._ready.then(ok => { if (ok) run(); else { clearTimeout(watchdog); finish(); } });
  },
};
const Ads = { midroll(onDone) { CG.midroll(onDone); } };

/* ============================ BOOT ============================ */
let lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const now = (typeof ts === 'number') ? ts : performance.now();
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt >= 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  if (!paused && !adPaused && S && (mode === 'bloom_pour' || mode === 'bloom_wait' || mode === 'extract'))
    simUpdate(dt);
  if (tutorialMode) tutTick(dt);
  render(now / 1000);
}
save = loadSave();
lang = save.lang === 'id' ? 'id' : 'en';
muted = !!save.muted;
resize();
applyLang();
CG.init();
showMenu();
requestAnimationFrame(loop);

/* Headless test hook (used by tests/test_pour_pressure.js). */
window.__PP_TEST__ = {
  CONFIG, CUSTOMERS, SHIFTS, ACHIEVEMENTS, I18N,
  flavorAt, bodyAt, applyPenalties, scoreAxis, scoreOrder,
  t, setLang, getLang, unlockAch,
  achUnlocked: () => Object.keys(save.ach).sort(),
  saveGet: () => save,
  reloadSave: () => { save = loadSave(); },
  getShiftOrder: () => [curShift, curOrder],
  TUT: {
    start: () => startTutorial(),
    skip: () => skipTutorial(),
    finish: () => onTutStart(),
    brewPress: () => onBrewPress(),
    tick: (dt) => tutTick(dt),
    get step() { return tutStep; },
    get active() { return tutorialMode; },
    warned: () => ({ chan: tutWarnedChan, agit: tutWarnedAgit }),
  },
  CG,
};
</script>
