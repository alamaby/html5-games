<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kopi Highlands (dev)</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="game"></div>
<div id="ui">
  <div id="touch-layer"></div>
  <div id="title-tag">KOPI HIGHLANDS</div>
  <div id="hud-top">
    <div class="pill" id="pill-cash">&#x1F4B0; <span id="hud-cash">$0.00</span></div>
    <div class="pill" id="pill-basket">&#x1F9FA; <span id="hud-basket">0/40</span></div>
    <div class="pill" id="pill-quality">&#x2B50; <span id="hud-quality">100</span></div>
    <div class="pill" id="pill-sacks">&#x1F333; <span id="hud-sacks">0</span></div>
    <div class="pill" id="pill-zone">&#x1F33F; <span id="hud-zone">Arabika</span></div>
    <div class="spacer"></div>
    <div class="pill small"><span id="hud-fps">--</span> fps &middot; <span id="hud-calls">--</span> calls</div>
    <button class="pill btn" id="btn-upgrades">&#x2B06; <span data-i18n="upgrades">UPGRADES</span></button>
    <button class="pill btn" id="btn-lang">ID</button>
  </div>
  <div id="hint" data-i18n="hint_start"></div>
  <div id="joy-base"><div id="joy-knob"></div></div>
  <svg id="pick-ring" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="4"/>
    <circle id="ring-gold" cx="60" cy="60" r="31" fill="none" stroke="#FFD34D" stroke-width="7" stroke-dasharray="10 7"/>
    <circle id="ring-shrink" cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <div id="floaters"></div>
  <div id="hut-marker">&#x2B07;</div>
  <button id="btn-pick"><span data-i18n="pick">PICK</span></button>
  <div id="wash-ui">
    <button id="btn-wash-good" class="wash-btn good"><span data-i18n="wash_good">GOOD</span></button>
    <button id="btn-wash-defect" class="wash-btn defect"><span data-i18n="wash_defect">DEFECT</span></button>
  </div>
  <button id="btn-load"><span data-i18n="load_drum">LOAD DRUM</span></button>
  <div id="roast-ui">
    <div id="roast-top"><span id="roast-temp">25°C</span><span id="roast-order">MEDIUM</span></div>
    <div id="roast-gauge">
      <div id="gauge-cold"></div><div id="gauge-green"></div><div id="gauge-red"></div>
      <div id="crack-tick"></div><div id="roast-needle"></div>
    </div>
    <div id="roast-mid">
      <div id="fuel-slider"><div id="fuel-knob"></div></div>
      <div id="roast-right">
        <div id="roast-progress"><div id="roast-band"></div><div id="roast-fill"></div></div>
        <div id="roast-beans">0 · Q100</div>
        <button id="btn-roast-stop"><span data-i18n="roast_stop">STOP</span></button>
      </div>
    </div>
  </div>
  <div id="firstcrack-banner"><span data-i18n="first_crack">FIRST CRACK!</span></div>
  <button id="btn-collect"><span data-i18n="collect">COLLECT</span> <span id="collect-val">$0</span></button>
  <!-- Fase 3: modal upgrade -->
  <div id="upgrade-modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <span data-i18n="upg_title">Empire Upgrades</span>
        <span id="upg-cash">$0.00</span>
      </div>
      <div id="upg-list"></div>
      <button id="btn-upg-close" class="modal-close"><span data-i18n="close">CLOSE</span></button>
    </div>
  </div>
  <!-- Fase 3: modal offline earnings -->
  <div id="offline-modal" class="modal">
    <div class="modal-card">
      <div class="modal-head"><span data-i18n="offline_title">While you were away</span></div>
      <div class="offline-body">
        <div class="offline-label" data-i18n="offline_earned">Your pickers earned</div>
        <div id="offline-amt">$0.00</div>
      </div>
      <button id="btn-off-collect" class="modal-close"><span data-i18n="offline_collect">COLLECT</span></button>
      <button id="btn-off-double" class="modal-alt"><span data-i18n="offline_double">2× COLLECT (AD)</span></button>
    </div>
  </div>
  <!-- Fase 3: mock ad overlay (SDK asli Fase 4) -->
  <div id="ad-overlay">
    <div class="ad-box">
      <div class="ad-tag" data-i18n="ad_mock">MOCK AD</div>
      <div class="ad-text" data-i18n="ad_text">Ad playing…</div>
      <div id="ad-count">3</div>
    </div>
  </div>
</div>
<!-- DEV ONLY: serve this folder over http (e.g. python3 -m http.server), then open src/index.dev.html.
     The shim exposes three's exports as globals so src/game.js runs as a classic script. -->
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
for (const k of Object.keys(THREE)) { if (!(k in window)) window[k] = THREE[k]; }
const s = document.createElement('script');
s.src = './game.js';
document.body.appendChild(s);
</script>
</body>
</html>
